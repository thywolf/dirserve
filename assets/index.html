<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0e11" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<title>dirserve — {{if .Path}}{{.Path}}{{else}}root{{end}}</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<body data-max-preview="{{.MaxPreview}}">

<div class="app">
  <header class="topbar">
    <button type="button" class="btn icon-only" id="btn-back" aria-label="Back to files">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m9.8 3.6-4 4.4 4 4.4"/>
      </svg>
    </button>
    <button type="button" class="btn drawer-btn" id="btn-drawer" aria-label="Browse files" aria-expanded="false" aria-controls="tree">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 4.2h7.2M6 8h7.2M6 11.8h7.2M2.8 4.2h.01M2.8 8h.01M2.8 11.8h.01"/>
      </svg>
    </button>
    <div class="brand">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 4.5A1.5 1.5 0 0 1 3.5 3h3l1.4 1.6h4.6A1.5 1.5 0 0 1 14 6.1v5.4A1.5 1.5 0 0 1 12.5 13h-9A1.5 1.5 0 0 1 2 11.5z"/>
        </svg>
      </span>
      <span>dirserve</span>
    </div>
    <span class="readonly" title="This server can only read">read-only</span>
    <div class="root" title="Served directory">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2.5 4.2A1.2 1.2 0 0 1 3.7 3h2.6l1.2 1.4h4.8a1.2 1.2 0 0 1 1.2 1.2v6.2a1.2 1.2 0 0 1-1.2 1.2H3.7a1.2 1.2 0 0 1-1.2-1.2z"/>
      </svg>
      <span id="root-path">{{.Root}}</span>
    </div>
    <button type="button" class="tbtn" id="btn-theme" title="Switch theme" aria-label="Switch to light theme">
      <svg class="sun" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
        <circle cx="8" cy="8" r="3.1"/>
        <path d="M8 1.4v1.7M8 12.9v1.7M1.4 8h1.7M12.9 8h1.7M3.5 3.5l1.2 1.2M11.3 11.3l1.2 1.2M12.5 3.5l-1.2 1.2M4.7 11.3l-1.2 1.2"/>
      </svg>
      <svg class="moon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M13.2 9.9A5.7 5.7 0 0 1 6.1 2.8a5.7 5.7 0 1 0 7.1 7.1z"/>
      </svg>
    </button>
  </header>

  <div class="body">
    <nav class="sidebar" aria-label="File tree">
      <div class="filterbar">
        <label class="filter">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
            <circle cx="7" cy="7" r="4.2"/><path d="m10.2 10.2 3 3"/>
          </svg>
          <input id="filter" type="search" placeholder="Filter files" autocomplete="off" spellcheck="false" aria-label="Filter files">
          <button type="button" class="filter-clear" id="filter-clear" aria-label="Clear filter" hidden>
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
              <path d="m5 5 6 6M11 5l-6 6"/>
            </svg>
          </button>
          <kbd>/</kbd>
        </label>
      </div>
      <div class="tree" id="tree" role="tree" aria-label="Files" tabindex="0">
        <noscript>
          <div class="noscript">
            {{if .HasParent}}<p class="up"><a href="{{.ParentHref}}">↑ parent directory</a></p>{{end}}
            {{if .Entries}}<ul class="plain">
              {{- range .Entries}}
              <li>
                <a href="{{.Href}}">{{if .Dir}}{{.Name}}/{{else}}{{.Name}}{{end}}</a>
                {{- if not .Dir}} <span class="num">{{.Size}}</span> <span class="num">{{.Time}}</span>{{end}}
              </li>
              {{- end}}
            </ul>
            {{else}}<p class="hint">This directory is empty.</p>{{end}}
            {{if .Truncated}}<p class="hint">Listing truncated at 5,000 entries.</p>{{end}}
          </div>
        </noscript>
      </div>
    </nav>

    <main class="main">
      <div class="head" id="head" hidden>
        <div class="who">
          <div class="crumb" id="crumb"></div>
          <div class="meta" id="meta"></div>
        </div>
        <div class="actions" id="actions"></div>
      </div>
      <!-- The pane is rendered by app.js: every navigation clears it, so
           anything static here would be discarded on the first selection. -->
      <div class="pane" id="pane"></div>
    </main>
    <div class="scrim" id="scrim" hidden></div>
  </div>
</div>
<script src="/app.js" defer></script>
</body>
</html>
